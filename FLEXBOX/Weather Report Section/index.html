<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="report-bg-continer">
    <div class="report-header">
      <div>
        <h1 class="location">Mumbai</h1>
        <p class="weather-condition">Sunny</p>
        <p class="humidity">78% Humidity</p>
      </div>
      <img class="image" src="https://assets.ccbp.in/frontend/intermediate-rwd/partly-sunny-img.png" alt="" />
    </div>
    <div class="reports-container">
      <div class="report">
        <p class="day">Tomorrow</p>
        <img class="report-image" src="https://assets.ccbp.in/frontend/intermediate-rwd/partly-cloudy-img.png" alt="" />
        <p class="temparature">32 <sup>o</sup> <br /> 24 <sup>o</sup></p>
        <p class="condition">Cloudy</p>
      </div>
      <div class="report">
        <p class="day">3rd Nov</p>
        <img class="report-image" src="https://assets.ccbp.in/frontend/intermediate-rwd/rain-with-sun-img.png" alt="" />
        <p class="temparature">26<sup>o</sup> <br />20<sup>o</sup></p>
        <p class="condition">Rainy</p>
      </div>
      <div class="report">
        <p class="day">4th Nov</p>
        <img class="report-image" src="https://assets.ccbp.in/frontend/intermediate-rwd/sunny-img.png" alt="" />
        <p class="temparature">48<sup>o</sup> <br /> 36 <sup>o</sup></p>
        <p class="condition">Sunny</p>
      </div>
      <div class="report">
        <p class="day">5th Nov</p>
        <img class="report-image" src="https://assets.ccbp.in/frontend/intermediate-rwd/rain-with-sun-img.png" alt="" />
        <p class="temparature">28<sup>o</sup> <br /> 18 <sup>o</sup></p>
        <p class="condition">Rainy</p>
      </div>
      <div class="report">
        <p class="day">6th Nov</p>
        <img class="report-image" src="https://assets.ccbp.in/frontend/intermediate-rwd/sunny-img.png" alt="" />
        <p class="temparature">44 <sup>o</sup> <br /> 32 <sup>o</sup></p>
        <p class="condition">Sunny</p>
      </div>
      <div class="report">
        <p class="day">7th Nov</p>
        <img class="report-image" src="https://assets.ccbp.in/frontend/intermediate-rwd/partly-cloudy-img.png" alt="" />
        <p class="temparature">35 <sup>o</sup> <br /> 26 <sup>o</sup></p>
        <p class="condition">Cloudy</p>
      </div>
      <div class="report">
        <p class="day">8th Nov</p>
        <img class="report-image" src="https://assets.ccbp.in/frontend/intermediate-rwd/rain-with-sun-img.png" alt="" />
        <p class="temparature">29 <sup>o</sup> <br /> 22 <sup>o</sup></p>
        <p class="condition">Rainy</p>
      </div>
    </div>
  </div>
</body>

</html>
